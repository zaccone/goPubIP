name: Go

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - run: go mod download
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: make build
      - name: Build container
        run: make container
